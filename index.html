<!doctype html>
<html lang="vi">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>SayGo: Thuê tài xế &amp; Đặt bàn</title>
		<meta name="description" content="Tự động chuyển hướng đến App Store hoặc Google Play cho ứng dụng SayGo." />
		<!-- Open Graph / Facebook -->
		<meta property="og:title" content="SayGo: Thuê tài xế &amp; Đặt bàn" />
		<meta property="og:description" content="Tự động chuyển hướng đến App Store hoặc Google Play cho ứng dụng SayGo." />
		<meta property="og:type" content="website" />
		<meta property="og:locale" content="vi_VN" />
		<meta property="og:image" content="./banner.png" />
		<meta property="og:image:alt" content="SayGo: Thuê tài xế &amp; Đặt bàn" />
		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="SayGo: Thuê tài xế &amp; Đặt bàn" />
		<meta name="twitter:description" content="Tự động chuyển hướng đến App Store hoặc Google Play cho ứng dụng SayGo." />
		<meta name="twitter:image" content="./banner.png" />
		<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    margin: 0; padding: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #fff;
  }
  .title {
    color: #f9d46a;
    font-size: clamp(28px, 6vw, 64px); /* co giãn theo màn hình */
    font-weight: 700;
    text-align: center;
    margin: clamp(24px, 8vw, 60px) 16px clamp(24px, 10vw, 80px);
    font-family: inherit;
    line-height: 1.15;
  }
  .store-links {
    display: flex;
    gap: clamp(16px, 6vw, 60px);
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;              /* cho phép xuống hàng */
    margin-top: clamp(16px, 6vw, 40px);
    padding: 0 16px;
    width: 100%;
    max-width: 1200px;
  }
  .store-badge {
    height: clamp(56px, 12vw, 120px); /* badge responsive */
    width: auto;
    transition: transform 0.1s;
    box-shadow: 0 2px 8px 0 rgba(0,0,0,0.12);
    border-radius: 22px;
    display: block;
    max-width: 90vw;              /* không tràn màn hình nhỏ */
  }
  @media (max-width: 600px) {
    body { justify-content: flex-start; }  /* tránh bị căn giữa quá thấp trên mobile */
    .store-links { flex-direction: column; }
  }
  @media (prefers-reduced-motion: reduce) {
    .store-badge { transition: none; }
  }
		</style>
	</head>
	<body>
		<div class="title">Tải ứng dụng ngay</div>
		<div class="store-links">
			<a href="https://apps.apple.com/vn/app/saygo/id6748329632" rel="noopener" id="apple-link">
				<img class="store-badge" src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="Download on the App Store" />
			</a>
			<a href="https://play.google.com/store/apps/details?id=vn.saygo" rel="noopener" id="play-link">
				<img class="store-badge" src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Get it on Google Play" />
			</a>
		</div>
		<noscript>
			<div class="store-links" style="margin-top:40px;">
				<a href="https://apps.apple.com/vn/app/saygo/id6748329632" rel="noopener">
					<img class="store-badge" src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="Download on the App Store" />
				</a>
				<a href="https://play.google.com/store/apps/details?id=vn.saygo" rel="noopener">
					<img class="store-badge" src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Get it on Google Play" />
				</a>
			</div>
		</noscript>
			<script>
				// Tự động phát hiện HĐH và chuyển hướng đến cửa hàng tương ứng
				(function () {
					var APP_STORE_URL = 'https://apps.apple.com/vn/app/saygo/id6748329632';
					var PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=vn.saygo';

					function isAndroid(ua) {
						return /Android/i.test(ua);
					}

							function isIOS(ua) {
								// Tính cả macOS như iOS theo yêu cầu
								return /(iPhone|iPad|iPod|Macintosh|Mac OS X)/i.test(ua);
							}

					function redirect(url) {
						try {
							window.location.replace(url);
						} catch (e) {
							window.location.href = url;
						}
					}

					function run() {
						var ua = navigator.userAgent || navigator.vendor || window.opera || '';
						if (isAndroid(ua)) {
							redirect(PLAY_STORE_URL);
							return;
						}
						if (isIOS(ua)) {
							redirect(APP_STORE_URL);
							return;
						}
						// Desktop hoặc HĐH khác: giữ nguyên trang với badge để người dùng chọn thủ công
					}

					if (document.readyState === 'loading') {
						document.addEventListener('DOMContentLoaded', run);
					} else {
						run();
					}
				})();
			</script>

		<!-- No JS needed for this static landing page style -->
	</body>
	</html>
